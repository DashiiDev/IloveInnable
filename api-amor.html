<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API do Amor | Innable & Dashii</title>
    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Reset básico */
        body, h1, p {
            margin: 0;
            padding: 0;
        }

        /* Estilos globais */
        body {
            background-color: #000;
            color: #00FFA3;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Título (estilo terminal) */
        .title {
            font-family: 'Press Start 2P', cursive;
            color: #FF2EDF;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #FF2EDF;
        }

        /* Área do terminal */
        .terminal {
            background-color: #111;
            border: 1px solid #00FFA3;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 600px;
            margin-bottom: 20px;
            text-align: left;
            min-height: 200px;
            position: relative;
        }

        /* Efeito de digitação */
        .typing {
            white-space: pre-wrap;
            overflow: hidden;
            border-right: 2px solid #FF2EDF;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #FF2EDF; }
        }

        /* Mensagem gerada */
        .message {
            margin-top: 20px;
            color: #FFF;
        }

        /* Botão "GERAR MENSAGEM" */
        .generate-button {
            background-color: #9D00FF;
            color: #FFF;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .generate-button:hover {
            background-color: #FF2EDF;
            transform: scale(1.05);
        }

        /* Contador de requisições */
        .counter {
            color: #FF2EDF;
            font-family: 'Press Start 2P', cursive;
            margin-bottom: 20px;
        }

        /* Botão de voltar */
        .back-button {
            background-color: #9D00FF;
            color: #FFF;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-button:hover {
            background-color: #FF2EDF;
            transform: scale(1.05);
        }

        /* Easter egg: Clicar no título 10 vezes */
        .hidden-message {
            color: #FF2EDF;
            font-family: 'Press Start 2P', cursive;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

        let counter = 0;

        // Função para gerar uma mensagem aleatória
        function generateMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("message").textContent = messages[randomIndex];
            counter++;
            document.getElementById("counter").textContent = counter;
        }

        // Easter egg: Clicar 10 vezes no título
        let clickCount = 0;
        const title = document.getElementById('title');

        title.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 10) {
                document.getElementById('hidden-message').style.display = 'block';
                clickCount = 0;
            }
        });
    </script>
</body>
<!-- Adicione este áudio no HTML (dentro do body) -->
<audio id="typing-sound" src="/assets/typing-sound.mp3" preload="auto"></audio>

<script>
    // Toca o som de digitação
    const typingSound = document.getElementById('typing-sound');

    function typeWriter() {
        if (i < initialText.length) {
            document.getElementById("typing-text").innerHTML += initialText.charAt(i);
            i++;
            typingSound.currentTime = 0;
            typingSound.play();
            setTimeout(typeWriter, speed);
        }
    }
</script>
